# docker compose up — pgvector, API на :8000 и интерфейс на :8501.
#
# Порт базы по умолчанию 5439, а не 5432/5433: на той же машине часто уже
# крутится Postgres другого проекта, и конфликт портов выглядит как «база
# не отвечает».

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kzcr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kzcr}
      POSTGRES_DB: ${POSTGRES_DB:-kzcr}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${KZCR_PG_PORT:-5439}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kzcr} -d ${POSTGRES_DB:-kzcr}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      KZCR_DATABASE_URL: postgresql://${POSTGRES_USER:-kzcr}:${POSTGRES_PASSWORD:-kzcr}@db:5432/${POSTGRES_DB:-kzcr}
      # Без ключа гибрид работает в режиме «правила + ML» и предупреждает об этом в отчёте.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      KZCR_OCR_ENABLED: ${KZCR_OCR_ENABLED:-true}
    # Корпус загружается в pgvector при старте; без изменений корпуса — мгновенно.
    command: sh -c "kzcr corpus load && uvicorn contract_risk.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${KZCR_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 30

  ui:
    build: .
    depends_on:
      api:
        condition: service_healthy
    environment:
      KZCR_API_URL: http://api:8000
    command: streamlit run src/contract_risk/ui/app.py --server.headless true --server.port 8501 --server.address 0.0.0.0
    ports:
      - "${KZCR_UI_PORT:-8501}:8501"

volumes:
  pgdata:
