[project]
name = "kz-contract-risk"
version = "0.1.0"
description = "Первичный скрининг договоров аренды, поставки и подряда для малого бизнеса РК: находит рискованные условия и объясняет их простым языком"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "jinja2>=3.1",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
]

[project.optional-dependencies]
# Плотные эмбеддинги (multilingual-e5). Без них работает детерминированный
# char-n-gram эмбеддер: он хуже на перефразах, но не требует скачивания весов.
embeddings = ["sentence-transformers>=3.0"]
# PDF-отчёт. WeasyPrint требует системные pango/cairo (brew install pango).
pdf = ["weasyprint>=62"]
# Сканы. Требует системный tesseract с языками rus и kaz.
ocr = ["pytesseract>=0.3.10"]
ui = ["streamlit>=1.38", "httpx>=0.27"]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
    "httpx>=0.27",
]

[project.scripts]
kzcr = "contract_risk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contract_risk = ["report/templates/*.j2", "llm/prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "pg: тесты против настоящего pgvector (нужен KZCR_TEST_DSN)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Тексты договоров и эталонные формулировки — это данные: перенос строки
# внутри юридической фразы делает её нечитаемой и ломает сверку с разметкой.
"src/contract_risk/rules/catalog.py" = ["E501"]
"src/contract_risk/rules/lexicon.py" = ["E501"]
"tests/*" = ["E501"]
