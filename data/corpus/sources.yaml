# Источники эталонного корпуса. Политика — docs/CORPUS_POLICY.md.
# Загружаются только статусы authored_cc0, official_public_domain, cc_by.
sources:
  - id: authored-v1
    title: "Эталонные формулировки kz-contract-risk, версия 1"
    license_status: authored_cc0
    notes: >-
      Написаны для проекта с нуля по мотивам диспозитивных норм ГК РК и
      распространённой практики. Чужие шаблоны не использовались.

  - id: gk-rk-special-part
    title: "Гражданский кодекс РК (Особенная часть): имущественный наём, поставка, подряд"
    license_status: candidate
    url: https://adilet.zan.kz/rus/docs/K990000409_
    legal_basis: "ст. 8 Закона РК «Об авторском праве и смежных правах» — официальный документ"
    notes: >-
      Кандидат: нормы как «умолчания», а не как формулировки договора.
      Перед загрузкой — сверить актуальную редакцию и номера статей.

  - id: goszakup-typical-forms
    title: "Типовые договоры государственных закупок"
    license_status: candidate
    legal_basis: "ст. 8 Закона РК «Об авторском праве и смежных правах» — официальный документ"
    notes: >-
      Кандидат. Формы перекошены в пользу заказчика (государства), поэтому
      допускаются только с разметкой favours: buyer / customer.
