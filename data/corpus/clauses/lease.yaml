# Эталонные формулировки: аренда. Источник authored-v1 (CC0).
# favours: neutral — не риск ни для одной стороны по LABELING_GUIDE;
# landlord / tenant — допустимо на рынке, но выгоднее этой стороне.
contract_type: lease
source: authored-v1
clauses:
  # --- penalty ---------------------------------------------------------------
  - id: lease.penalty.n1
    category: penalty
    lang: ru
    favours: neutral
    text: "В случае нарушения срока внесения арендной платы Арендатор по требованию Арендодателя уплачивает пеню в размере 0,1% от просроченной суммы за каждый день просрочки, но не более 10% от просроченной суммы."
    note: "Пеня 0,1% в день с потолком 10% — распространённый сбалансированный уровень."
  - id: lease.penalty.n2
    category: penalty
    lang: ru
    favours: neutral
    text: "За нарушение сроков исполнения денежных обязательств виновная Сторона уплачивает другой Стороне пеню в размере 0,1% от суммы неисполненного обязательства за каждый день просрочки; общий размер пени ограничен 10% от этой суммы."
    note: "Взаимная неустойка: одинаковая мера для обеих сторон."
  - id: lease.penalty.l1
    category: penalty
    lang: ru
    favours: landlord
    text: "За просрочку арендных платежей Арендатор уплачивает пеню в размере 0,2% от суммы долга за каждый день просрочки, но не более 20% от суммы долга."
    note: "Верхняя граница рынка в пользу арендодателя: ставка выше, но потолок есть."
  - id: lease.penalty.t1
    category: penalty
    lang: ru
    favours: tenant
    text: "За просрочку арендных платежей Арендатор уплачивает пеню в размере 0,05% от суммы долга за каждый день просрочки, но не более 5% от суммы долга; пеня начисляется с шестого дня просрочки."
    note: "Мягкий вариант в пользу арендатора: льготный период и низкий потолок."
  - id: lease.penalty.kk1
    category: penalty
    lang: kk
    favours: neutral
    text: "Жалдау ақысын төлеу мерзімі бұзылған жағдайда Жалға алушы Жалға берушінің талабы бойынша мерзімі өткен соманың 0,1% мөлшерінде әрбір кешіктірілген күн үшін өсімпұл төлейді, бірақ мерзімі өткен соманың 10%-ынан артық емес."
    note: "Казахская версия lease.penalty.n1."

  # --- auto_renewal ----------------------------------------------------------
  - id: lease.renewal.n1
    category: auto_renewal
    lang: ru
    favours: neutral
    text: "По истечении срока аренды Арендатор, надлежащим образом исполнявший свои обязанности, имеет преимущественное право на заключение договора на новый срок; условия нового договора согласовываются Сторонами."
    note: "Продление — по согласованию, без молчаливой пролонгации."
  - id: lease.renewal.n2
    category: auto_renewal
    lang: ru
    favours: neutral
    text: "Договор может быть продлен на новый срок путем подписания Сторонами дополнительного соглашения не позднее чем за 15 дней до окончания срока аренды."
  - id: lease.renewal.l1
    category: auto_renewal
    lang: ru
    favours: landlord
    text: "Если Арендатор за 60 дней до окончания срока не заявит о прекращении Договора, Договор продлевается на тот же срок на прежних условиях."
    note: "Молчаливое продление с длинным сроком отказа — выгоднее арендодателю."
  - id: lease.renewal.t1
    category: auto_renewal
    lang: ru
    favours: tenant
    text: "Договор продлевается на тот же срок по письменному заявлению Арендатора, направленному не позднее чем за 30 дней до окончания срока; при отсутствии нарушений со стороны Арендатора Арендодатель не вправе отказать в продлении."
  - id: lease.renewal.kk1
    category: auto_renewal
    lang: kk
    favours: neutral
    text: "Шарт Тараптар қосымша келісімге жалдау мерзімі аяқталғанға дейін кемінде 15 күн бұрын қол қою арқылы жаңа мерзімге ұзартылуы мүмкін."

  # --- liability -------------------------------------------------------------
  - id: lease.liability.n1
    category: liability
    lang: ru
    favours: neutral
    text: "Сторона, не исполнившая или ненадлежащим образом исполнившая обязательства по Договору, возмещает другой Стороне причиненный реальный ущерб; упущенная выгода возмещению не подлежит."
  - id: lease.liability.n2
    category: liability
    lang: ru
    favours: neutral
    text: "Неустойка засчитывается в сумму убытков. Ответственность каждой из Сторон по Договору ограничивается суммой арендной платы за 12 месяцев."
    note: "Зачётная неустойка и симметричный лимит ответственности."
  - id: lease.liability.l1
    category: liability
    lang: ru
    favours: landlord
    text: "Арендатор несет полную материальную ответственность за ущерб, причиненный Помещению и имуществу Арендодателя по вине Арендатора или его посетителей."
  - id: lease.liability.t1
    category: liability
    lang: ru
    favours: tenant
    text: "Арендодатель отвечает за недостатки Помещения, препятствующие его использованию, даже если во время заключения Договора он не знал об этих недостатках."
  - id: lease.liability.kk1
    category: liability
    lang: kk
    favours: neutral
    text: "Міндеттемесін орындамаған немесе тиісінше орындамаған Тарап екінші Тарапқа келтірілген нақты залалды өтейді; жіберілген пайда өтелмейді."

  # --- force_majeure ---------------------------------------------------------
  - id: lease.fm.n1
    category: force_majeure
    lang: ru
    favours: neutral
    text: "Сторона освобождается от ответственности за неисполнение обязательств, если докажет, что надлежащее исполнение оказалось невозможным вследствие непреодолимой силы, то есть чрезвычайных и непредотвратимых при данных условиях обстоятельств. О таких обстоятельствах Сторона уведомляет другую Сторону в течение 5 рабочих дней и представляет подтверждающий документ."
  - id: lease.fm.n2
    category: force_majeure
    lang: ru
    favours: neutral
    text: "Если обстоятельства непреодолимой силы действуют более 60 календарных дней, каждая из Сторон вправе отказаться от Договора; за период, когда пользование Помещением невозможно, арендная плата не начисляется."
  - id: lease.fm.kk1
    category: force_majeure
    lang: kk
    favours: neutral
    text: "Егер Тарап тиісінше орындау еңсерілмейтін күш салдарынан мүмкін болмағанын дәлелдесе, міндеттемелерді орындамағаны үшін жауапкершіліктен босатылады; бұл туралы екінші Тарапқа 5 жұмыс күні ішінде хабарлайды."

  # --- jurisdiction ----------------------------------------------------------
  - id: lease.jurisdiction.n1
    category: jurisdiction
    lang: ru
    favours: neutral
    text: "Споры, вытекающие из Договора, разрешаются в судебном порядке по правилам подсудности, установленным процессуальным законодательством Республики Казахстан."
  - id: lease.jurisdiction.n2
    category: jurisdiction
    lang: ru
    favours: neutral
    text: "До обращения в суд Стороны соблюдают претензионный порядок: претензия рассматривается в течение 15 рабочих дней. Применимым правом является право Республики Казахстан."
  - id: lease.jurisdiction.kk1
    category: jurisdiction
    lang: kk
    favours: neutral
    text: "Шарттан туындайтын даулар Қазақстан Республикасының процестік заңнамасында белгіленген соттылық қағидалары бойынша сот тәртібімен шешіледі."

  # --- termination -----------------------------------------------------------
  - id: lease.termination.n1
    category: termination
    lang: ru
    favours: neutral
    text: "Каждая из Сторон вправе в одностороннем порядке отказаться от исполнения Договора, предупредив другую Сторону не позднее чем за один месяц."
    note: "Совпадает с общим правилом ст. 404 ГК РК о сроке предупреждения."
  - id: lease.termination.n2
    category: termination
    lang: ru
    favours: neutral
    text: "При досрочном прекращении Договора обеспечительный платеж возвращается Арендатору в течение 10 рабочих дней за вычетом документально подтвержденной задолженности."
  - id: lease.termination.n3
    category: termination
    lang: ru
    favours: neutral
    text: "Договор может быть досрочно расторгнут судом по требованию одной из Сторон при существенном нарушении Договора другой Стороной."
  - id: lease.termination.l1
    category: termination
    lang: ru
    favours: landlord
    text: "Арендодатель вправе отказаться от Договора, предупредив Арендатора за один месяц, если Арендатор более двух раз подряд не внес арендную плату в установленный срок."
  - id: lease.termination.t1
    category: termination
    lang: ru
    favours: tenant
    text: "Арендатор вправе досрочно отказаться от Договора без уплаты компенсации, предупредив Арендодателя за два месяца."
  - id: lease.termination.kk1
    category: termination
    lang: kk
    favours: neutral
    text: "Тараптардың әрқайсысы екінші Тарапты кемінде бір ай бұрын ескерте отырып, Шартты орындаудан біржақты тәртіппен бас тарта алады."

  # --- unilateral_change -----------------------------------------------------
  - id: lease.change.n1
    category: unilateral_change
    lang: ru
    favours: neutral
    text: "Размер арендной платы может изменяться по соглашению Сторон, оформленному в письменной форме, не чаще одного раза в год."
  - id: lease.change.n2
    category: unilateral_change
    lang: ru
    favours: neutral
    text: "Любые изменения условий аренды вступают в силу только после подписания дополнительного соглашения обеими Сторонами."
  - id: lease.change.l1
    category: unilateral_change
    lang: ru
    favours: landlord
    text: "Арендная плата индексируется один раз в год на уровень инфляции, опубликованный уполномоченным государственным органом, при условии письменного уведомления Арендатора не менее чем за 30 дней."
    note: "Одностороннее изменение с потолком и уведомлением — граница рынка в пользу арендодателя."
  - id: lease.change.t1
    category: unilateral_change
    lang: ru
    favours: tenant
    text: "Арендная плата фиксируется на весь срок аренды и изменению не подлежит."
  - id: lease.change.kk1
    category: unilateral_change
    lang: kk
    favours: neutral
    text: "Жалдау ақысының мөлшері жылына бір реттен жиі емес, Тараптардың жазбаша келісімі бойынша ғана өзгертілуі мүмкін."
