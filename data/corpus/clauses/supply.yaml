# Эталонные формулировки: поставка. Источник authored-v1 (CC0).
contract_type: supply
source: authored-v1
clauses:
  # --- penalty ---------------------------------------------------------------
  - id: supply.penalty.n1
    category: penalty
    lang: ru
    favours: neutral
    text: "За просрочку поставки Поставщик уплачивает Покупателю неустойку в размере 0,1% от стоимости не поставленного в срок Товара за каждый день просрочки, но не более 10% от стоимости такого Товара."
  - id: supply.penalty.n2
    category: penalty
    lang: ru
    favours: neutral
    text: "За просрочку оплаты Покупатель уплачивает Поставщику пеню в размере 0,1% от суммы просроченного платежа за каждый день просрочки, но не более 10% от этой суммы."
  - id: supply.penalty.s1
    category: penalty
    lang: ru
    favours: supplier
    text: "Пеня за просрочку оплаты составляет 0,15% от суммы долга за каждый день просрочки, но не более 15% от суммы долга."
  - id: supply.penalty.b1
    category: penalty
    lang: ru
    favours: buyer
    text: "Пеня за просрочку поставки составляет 0,15% от стоимости партии за каждый день просрочки, но не более 15% от стоимости партии."

  # --- payment ---------------------------------------------------------------
  - id: supply.payment.n1
    category: payment
    lang: ru
    favours: neutral
    text: "Покупатель оплачивает каждую партию Товара в течение 30 календарных дней с даты подписания товарной накладной."
  - id: supply.payment.n2
    category: payment
    lang: ru
    favours: neutral
    text: "Покупатель вносит предоплату в размере 30% стоимости партии; оставшиеся 70% оплачиваются в течение 15 банковских дней после поставки."
  - id: supply.payment.s1
    category: payment
    lang: ru
    favours: supplier
    text: "Покупатель вносит предоплату в размере 50% стоимости партии, оставшаяся сумма оплачивается в день поставки."
  - id: supply.payment.b1
    category: payment
    lang: ru
    favours: buyer
    text: "Оплата производится в течение 45 календарных дней после поставки Товара надлежащего качества."

  # --- acceptance ------------------------------------------------------------
  - id: supply.acceptance.n1
    category: acceptance
    lang: ru
    favours: neutral
    text: "Приемка по количеству осуществляется в момент передачи Товара, по качеству — в течение 14 календарных дней; о скрытых недостатках Покупатель уведомляет Поставщика в течение гарантийного срока."
  - id: supply.acceptance.n2
    category: acceptance
    lang: ru
    favours: neutral
    text: "При обнаружении несоответствия Товара Покупатель составляет акт и вызывает представителя Поставщика; Поставщик заменяет некачественный Товар в течение 10 дней."
  - id: supply.acceptance.s1
    category: acceptance
    lang: ru
    favours: supplier
    text: "Претензии по явным недостаткам Товара принимаются в течение 5 рабочих дней с даты поставки; о скрытых недостатках Покупатель заявляет в течение гарантийного срока."
  - id: supply.acceptance.b1
    category: acceptance
    lang: ru
    favours: buyer
    text: "Покупатель вправе заявить о недостатках Товара в течение всего гарантийного срока, а при его отсутствии — в течение двух лет с даты передачи."

  # --- unilateral_change -----------------------------------------------------
  - id: supply.change.n1
    category: unilateral_change
    lang: ru
    favours: neutral
    text: "Цена Товара фиксируется в спецификации и может быть изменена только по соглашению Сторон."
  - id: supply.change.n2
    category: unilateral_change
    lang: ru
    favours: neutral
    text: "Условия поставки, не согласованные в спецификации, определяются дополнительным соглашением, подписанным обеими Сторонами."
  - id: supply.change.s1
    category: unilateral_change
    lang: ru
    favours: supplier
    text: "Поставщик вправе изменить цену на будущие, еще не согласованные партии, уведомив Покупателя за 30 дней; в этом случае Покупатель вправе отказаться от Договора без санкций."
  - id: supply.change.b1
    category: unilateral_change
    lang: ru
    favours: buyer
    text: "Цена Товара остается неизменной в течение всего срока действия Договора."

  # --- auto_renewal ----------------------------------------------------------
  - id: supply.renewal.n1
    category: auto_renewal
    lang: ru
    favours: neutral
    text: "Договор действует до 31 декабря текущего года; продление на следующий год оформляется дополнительным соглашением."

  # --- liability -------------------------------------------------------------
  - id: supply.liability.n1
    category: liability
    lang: ru
    favours: neutral
    text: "Стороны возмещают друг другу реальный ущерб, причиненный неисполнением обязательств; упущенная выгода не возмещается."
  - id: supply.liability.n2
    category: liability
    lang: ru
    favours: neutral
    text: "Уплата неустойки не освобождает Стороны от исполнения обязательств в натуре; неустойка засчитывается в сумму убытков."

  # --- force_majeure ---------------------------------------------------------
  - id: supply.fm.n1
    category: force_majeure
    lang: ru
    favours: neutral
    text: "Сторона, для которой исполнение стало невозможным из-за непреодолимой силы, освобождается от ответственности на время действия таких обстоятельств, если в течение 5 рабочих дней письменно уведомила другую Сторону; при действии обстоятельств более 60 дней каждая Сторона вправе отказаться от Договора."

  # --- jurisdiction ----------------------------------------------------------
  - id: supply.jurisdiction.n1
    category: jurisdiction
    lang: ru
    favours: neutral
    text: "Споры, не урегулированные в претензионном порядке, передаются на рассмотрение суда по правилам подсудности Республики Казахстан; применимое право — право Республики Казахстан."

  # --- termination -----------------------------------------------------------
  - id: supply.termination.n1
    category: termination
    lang: ru
    favours: neutral
    text: "Каждая из Сторон вправе отказаться от Договора с предупреждением другой Стороны за 30 дней при условии завершения расчетов по уже поставленным партиям."
  - id: supply.termination.n2
    category: termination
    lang: ru
    favours: neutral
    text: "Договор может быть расторгнут по соглашению Сторон либо судом при существенном нарушении его условий одной из Сторон."
  - id: supply.termination.s1
    category: termination
    lang: ru
    favours: supplier
    text: "Поставщик вправе приостановить отгрузки при просрочке оплаты более чем на 10 дней до погашения задолженности, а при просрочке более 30 дней — отказаться от Договора."
  - id: supply.termination.b1
    category: termination
    lang: ru
    favours: buyer
    text: "Покупатель вправе отказаться от Договора при повторной просрочке поставки более чем на 10 дней."
