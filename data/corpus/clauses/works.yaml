# Эталонные формулировки: подряд и услуги. Источник authored-v1 (CC0).
contract_type: works
source: authored-v1
clauses:
  # --- penalty ---------------------------------------------------------------
  - id: works.penalty.n1
    category: penalty
    lang: ru
    favours: neutral
    text: "За нарушение конечного срока выполнения работ Подрядчик уплачивает Заказчику пеню в размере 0,1% от стоимости просроченных работ за каждый день просрочки, но не более 10% от стоимости этих работ."
  - id: works.penalty.n2
    category: penalty
    lang: ru
    favours: neutral
    text: "Если Заказчик задерживает оплату выполненных работ, Подрядчик вправе потребовать пеню 0,1% от суммы задолженности за каждый день задержки; совокупный размер пени не превышает 10% от этой суммы."
  - id: works.penalty.c1
    category: penalty
    lang: ru
    favours: contractor
    text: "Общий размер неустойки Подрядчика за нарушение сроков не может превышать 5% от стоимости работ."
  - id: works.penalty.u1
    category: penalty
    lang: ru
    favours: customer
    text: "За просрочку выполнения работ Подрядчик уплачивает пеню 0,15% от цены работ за каждый день просрочки, но не более 15% от цены работ."

  # --- payment ---------------------------------------------------------------
  - id: works.payment.n1
    category: payment
    lang: ru
    favours: neutral
    text: "Заказчик оплачивает работы в течение 15 рабочих дней с даты подписания акта выполненных работ."
  - id: works.payment.n2
    category: payment
    lang: ru
    favours: neutral
    text: "Заказчик выплачивает аванс в размере 30% цены работ; окончательный расчет производится в течение 10 банковских дней после приемки работ."
  - id: works.payment.c1
    category: payment
    lang: ru
    favours: contractor
    text: "Заказчик выплачивает аванс в размере 50% цены работ до их начала; остаток — в течение 5 банковских дней после подписания акта."
  - id: works.payment.u1
    category: payment
    lang: ru
    favours: customer
    text: "Оплата производится в течение 30 дней после подписания акта выполненных работ; аванс не предусмотрен."

  # --- acceptance ------------------------------------------------------------
  - id: works.acceptance.n1
    category: acceptance
    lang: ru
    favours: neutral
    text: "Заказчик в течение 10 рабочих дней с даты получения акта выполненных работ подписывает его либо направляет мотивированный отказ с перечнем необходимых доработок и сроками их устранения."
  - id: works.acceptance.n2
    category: acceptance
    lang: ru
    favours: neutral
    text: "Недостатки, обнаруженные при приемке, фиксируются в двустороннем акте; Подрядчик устраняет их за свой счет в согласованный Сторонами срок."
  - id: works.acceptance.c1
    category: acceptance
    lang: ru
    favours: contractor
    text: "Если в течение 10 рабочих дней с даты получения акта Заказчик не подписал его и не направил мотивированный отказ, работы считаются принятыми."
  - id: works.acceptance.u1
    category: acceptance
    lang: ru
    favours: customer
    text: "Работы считаются принятыми только после подписания акта обеими Сторонами и устранения всех недостатков, выявленных при приемке."

  # --- unilateral_change -----------------------------------------------------
  - id: works.change.n1
    category: unilateral_change
    lang: ru
    favours: neutral
    text: "Цена работ является твердой; ее изменение возможно только при изменении объема работ по дополнительному соглашению Сторон."
  - id: works.change.n2
    category: unilateral_change
    lang: ru
    favours: neutral
    text: "Изменение сроков и объема работ оформляется дополнительным соглашением с уточненной сметой."
  - id: works.change.c1
    category: unilateral_change
    lang: ru
    favours: contractor
    text: "При росте стоимости материалов более чем на 10% Подрядчик вправе потребовать пересмотра цены, а при отказе Заказчика — расторжения Договора с оплатой выполненных работ."
  - id: works.change.u1
    category: unilateral_change
    lang: ru
    favours: customer
    text: "Цена работ не подлежит увеличению, в том числе при удорожании материалов."

  # --- termination -----------------------------------------------------------
  - id: works.termination.n1
    category: termination
    lang: ru
    favours: neutral
    text: "Заказчик вправе отказаться от Договора до сдачи результата работ, уплатив Подрядчику часть цены пропорционально выполненным работам и возместив понесенные расходы."
    note: "Стандартное право заказчика в подряде: отказ возможен, но выполненное оплачивается."
  - id: works.termination.n2
    category: termination
    lang: ru
    favours: neutral
    text: "Любая из Сторон может отказаться от Договора во внесудебном порядке, направив другой Стороне письменное уведомление не менее чем за тридцать дней до даты прекращения."

  # --- liability -------------------------------------------------------------
  - id: works.liability.n1
    category: liability
    lang: ru
    favours: neutral
    text: "Сторона, нарушившая Договор, возмещает другой Стороне реальный ущерб; неустойка засчитывается в сумму убытков."
  - id: works.liability.n2
    category: liability
    lang: ru
    favours: neutral
    text: "Совокупная ответственность каждой из Сторон по Договору ограничена ценой работ."

  # --- auto_renewal ----------------------------------------------------------
  - id: works.renewal.n1
    category: auto_renewal
    lang: ru
    favours: neutral
    text: "Договор действует до полного исполнения Сторонами обязательств; продление сроков выполнения работ оформляется дополнительным соглашением."

  # --- force_majeure ---------------------------------------------------------
  - id: works.fm.n1
    category: force_majeure
    lang: ru
    favours: neutral
    text: "Сроки выполнения работ продлеваются на время действия обстоятельств непреодолимой силы при условии уведомления другой Стороны в течение 5 рабочих дней; при их действии более 60 дней каждая Сторона вправе отказаться от Договора с оплатой выполненных работ."

  # --- jurisdiction ----------------------------------------------------------
  - id: works.jurisdiction.n1
    category: jurisdiction
    lang: ru
    favours: neutral
    text: "Споры разрешаются в претензионном порядке, а при недостижении согласия — судом по правилам подсудности, установленным законодательством Республики Казахстан."
